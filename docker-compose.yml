services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bmq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bmq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
